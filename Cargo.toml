[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["node-litesvm/tests/clock-example"]

[workspace.package]
version = "0.5.0-jito-2.1.21"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LiteSVM/litesvm"
rust-version = "1.75.0"

[workspace.dependencies]
bincode = "1.3"
criterion = "0.5"
ed25519-dalek = "1.0.1"
indexmap = "2.6"
itertools = "0.14"
libsecp256k1 = "0.6.0"
litesvm = { path = "crates/litesvm", version = "0.5" }
log = "0.4"
napi = { version = "2.12.2", default-features = false }
qualifier_attr = "0.2.2"
serde = "1.0"
smallvec = "1.13"
solana-address-lookup-table-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-address-lookup-table-program", tag = "v2.1.21-jito" }
solana-bpf-loader-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-bpf-loader-program", tag = "v2.1.21-jito" }
solana-compute-budget = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-compute-budget", tag = "v2.1.21-jito" }
solana-compute-budget-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-compute-budget-program", tag = "v2.1.21-jito" }
solana-config-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-config-program", tag = "v2.1.21-jito" }
solana-fee = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-fee", tag = "v2.1.21-jito" }
solana-loader-v4-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-loader-v4-program", tag = "v2.1.21-jito" }
solana-log-collector = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-log-collector", tag = "v2.1.21-jito" }
solana-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-program", tag = "v2.1.21-jito" }
solana-program-runtime = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-program-runtime", tag = "v2.1.21-jito" }
solana-program-test = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-program-test", tag = "v2.1.21-jito" }
solana-runtime-transaction = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-runtime-transaction", tag = "v2.1.21-jito" }
solana-sdk = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-sdk", tag = "v2.1.21-jito" }
solana-stake-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-stake-program", tag = "v2.1.21-jito" }
solana-svm = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-svm", tag = "v2.1.21-jito" }
solana-svm-transaction = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-svm-transaction", tag = "v2.1.21-jito" }
solana-system-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-system-program", tag = "v2.1.21-jito" }
solana-timings = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-timings", tag = "v2.1.21-jito" }
solana-vote-program = { git = "https://github.com/jito-foundation/jito-solana.git", package = "solana-vote-program", tag = "v2.1.21-jito" }
spl-associated-token-account-client = "2.0"
spl-token = "7.0.0"
spl-token-2022 = "6.0.0"
test-log = "0.2"
thiserror = "2.0"
tokio = "1.35"

[profile.bench]
debug = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.clippy]
result_large_err = "allow"
